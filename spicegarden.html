<body>

    <!-- Navbar -->
    <header>
        <h1 class="logo">RAVI LIC</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#about">About</a>

        </nav>
    </header>

        <div class="menu-container">

                <p>₹220</p>

        <p>Serving delicious food since 2010 with love and passion.</p>

    <!-- Contact Section -->
    <section id="contact" class="section fade-in">
        <h2>Contact Us</h2>

            <input type="text" placeholder="Your Name">
